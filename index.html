<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BESTIAWORKS</title>
<meta name="description" content="BESTIAWORKS のリンクまとめ">
<meta property="og:type" content="website">
<meta property="og:title" content="BESTIAWORKS">
<meta property="og:description" content="Riotaro のリンクまとめ / イラスト・ドット絵">
<meta property="og:url" content="https://riotaro015.github.io/portfolio/">
<meta property="og:image" content="https://riotaro015.github.io/portfolio/ogp.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="icon.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=block" rel="stylesheet">
<script>try{var d=document.documentElement;if(!sessionStorage.b&&!matchMedia("(prefers-reduced-motion:reduce)").matches)d.classList.add("boot");if(localStorage.crt==="0")d.classList.add("nocrt");d.classList.add("fl")}catch(e){}</script>
<style>
:root{--bg:#1a1c2c;--win:#262b54;--line:#f4f4f4;--text:#f4f4f4;--dim:#9aa3d6;--hi:#ffcd75;--open:#38b764;--ltd:#ffcd75;--closed:#b13e53}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:20px 16px;background:var(--bg);color:var(--text);
  font:16px/1.6 "DotGothic16",ui-monospace,monospace}
.win{width:100%;max-width:400px;background:var(--win);padding:24px 20px;
  box-shadow:0 -4px 0 0 var(--line),0 4px 0 0 var(--line),-4px 0 0 0 var(--line),4px 0 0 0 var(--line),8px 8px 0 0 #0d0e18}
header{text-align:center;margin-bottom:26px;position:relative}
#icon{width:128px;height:128px;image-rendering:pixelated;display:block;margin:0 auto 10px;box-shadow:0 0 0 4px var(--line);cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
#icon.hop{animation:hop .4s steps(4)}
@keyframes hop{30%{transform:translateY(-14px)}60%{transform:translateY(0)}80%{transform:translateY(-5px)}}
h1{font-size:22px;letter-spacing:.08em;font-weight:400}
.say{white-space:pre-wrap;min-height:calc(6.4em + 24px);margin-top:14px;padding:10px 12px;border:2px solid var(--line);background:#1a1c2c;font-size:14px;text-align:left}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.talk{display:block;margin:12px auto 0;padding:8px 20px;border:2px solid var(--hi);background:transparent;color:var(--hi);font:inherit;font-size:14px;cursor:pointer}
.talk:hover,.talk:focus-visible{outline:0;background:var(--hi);color:var(--bg)}
.talk::first-letter{animation:cur .5s steps(2) infinite}
#icon:hover{filter:brightness(1.15)}
.say::after{content:"▼";float:right;color:var(--hi);animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
.badge{margin:26px 0;padding:14px 12px;border:2px solid var(--line);font-size:14px;text-align:center}
.badge .st{display:flex;align-items:center;justify-content:center;gap:8px}
.dot{width:10px;height:10px;background:var(--c);flex:none}
.badge[data-s=open]{--c:var(--open)}.badge[data-s=limited]{--c:var(--ltd)}.badge[data-s=closed]{--c:var(--closed)}
.cd{margin-top:2px;color:var(--hi)}.cd b{font-size:20px;font-weight:400}
.gauge{display:flex;gap:2px;margin-top:6px}.gauge i{flex:1;height:8px;background:#1a1c2c}.gauge i.on{background:var(--hi)}
h2{margin:32px 0 12px;font-size:12px;font-weight:400;color:var(--hi);letter-spacing:.1em}
h2::before{content:"■ "}
.grp{display:grid;gap:12px}
.grp a,.grp button{display:flex;align-items:center;width:100%;padding:12px 14px;border:2px solid var(--line);background:transparent;color:inherit;
  font:inherit;text-decoration:none;cursor:pointer;text-align:left}
.grp a::before,.grp button::before{content:"";width:12px;height:12px;margin-right:10px;flex:none;background:var(--hi);clip-path:polygon(0 0,100% 50%,0 100%);visibility:hidden}
.grp a:hover,.grp a:focus-visible,.grp button:hover,.grp button:focus-visible{outline:0;background:#353b7a;color:var(--hi)}
.grp a:hover::before,.grp a:focus-visible::before,.grp button:hover::before,.grp button:focus-visible::before{visibility:visible}
#events{margin-top:30px}#events h2{margin:0 0 12px}
.ev{display:grid;gap:14px}
.evc{border:2px solid var(--line);padding:12px 14px;font-size:14px}
.evc.pl{border-style:dashed}
.evc.next{border:3px solid var(--hi);background:rgba(255,205,117,.09);box-shadow:4px 4px 0 0 #0d0e18}
.evc.next .n{font-size:16px}
.evc .bk{margin-top:10px;padding-top:10px;border-top:1px dashed var(--dim)}
.evc .bt{font-size:13px;line-height:1.7}
.tag.nx{background:var(--hi);border-color:var(--hi);color:var(--bg)}.tag.nb{color:var(--hi)}
.evc a{color:inherit;text-decoration:none}.evc a:hover,.evc a:focus-visible{color:var(--hi);outline:0;text-decoration:underline}
.evc .n{display:block;margin-bottom:6px}
.evc small{display:block;color:var(--dim);font-size:12px;line-height:1.8}
.evc .cd2{color:var(--hi)}
.tag{display:inline-block;margin-right:6px;padding:0 6px;border:1px solid currentColor;font-size:11px;line-height:1.5;vertical-align:middle}
.tag.ok{color:var(--open)}.tag.pl{color:var(--hi)}.tag.ad{color:var(--closed)}
.evx{list-style:none;padding:0;margin-top:14px;line-height:1.7;font-size:12px;color:var(--dim)}.evx li{margin-top:6px}.evx a{color:inherit}.evx a:hover,.evx a:focus-visible{color:var(--hi);outline:0}
.grp .fav{width:20px;height:20px;margin-right:10px;flex:none;image-rendering:pixelated}
.grp b{display:block;font-weight:400}
.grp small{display:block;color:var(--dim);font-size:12px;line-height:1.6;margin-top:2px}
.grp a:hover small,.grp a:focus-visible small,.grp button:hover small,.grp button:focus-visible small{color:var(--text)}
.grp button{border-style:dashed}
footer{margin-top:36px;text-align:center;color:var(--dim);font-size:12px}
.opt{display:flex;align-items:center;gap:6px;margin-top:0;font-size:13px}
.opt span:first-child{color:var(--hi);margin-right:6px}
.opt button{padding:2px 12px;border:2px solid var(--line);background:transparent;color:var(--dim);font:inherit;cursor:pointer}
.opt button[aria-pressed=true]{background:var(--hi);border-color:var(--hi);color:var(--bg)}
.opt button:hover,.opt button:focus-visible{outline:0;border-color:var(--hi);color:var(--hi)}
.opt button[aria-pressed=true]:hover,.opt button[aria-pressed=true]:focus-visible{color:var(--bg)}
#err{color:var(--closed);text-align:center}
body{background-image:conic-gradient(#20233a 25%,transparent 0 50%,#20233a 0 75%,transparent 0);background-size:8px 8px}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.35))}
.nocrt body::after{display:none}
.bar{display:flex;justify-content:space-between;margin:-24px -20px 20px;padding:2px 10px;background:var(--line);color:var(--bg);font-size:12px;letter-spacing:.08em}
.opts{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:12px 18px;padding-bottom:18px;margin-bottom:28px;border-bottom:2px solid var(--dim)}
.optt{flex:1 0 100%;margin:0}
.win.go{animation:on .45s steps(6)}
@keyframes on{from{transform:scaleY(.02);filter:brightness(2.5)}60%{transform:scaleY(1.02);filter:brightness(1.4)}to{transform:none;filter:none}}
#boot{display:none;position:fixed;inset:0;z-index:100;background:#0d0e18;color:var(--open);padding:24px;cursor:pointer}
#boot pre{font:inherit;font-size:14px;line-height:1.8;white-space:pre-wrap}
.boot #boot{display:grid;place-items:center}.boot .win,.fl .win{visibility:hidden}
.grp a:hover::before,.grp button:hover::before,.grp a:focus-visible::before,.grp button:focus-visible::before{animation:cur .5s steps(2) infinite}
@keyframes cur{50%{transform:translateX(3px)}}
.colL,.colR{display:contents}
@media (min-width:860px){
  .win{max-width:1120px;padding:28px 36px 24px;display:grid;grid-template-columns:340px 1fr;grid-template-areas:"t t" "o o" "L R" "e e" "f f";column-gap:48px;align-content:start}
  .colL{display:block;grid-area:L}.colR{display:block;grid-area:R}
  .optt{text-align:right}
  .opts{grid-area:o}.bar{grid-area:t;margin:-28px -36px 24px}#err{grid-area:e}footer{grid-area:f}
  header{margin-bottom:0}
  #icon{width:192px;height:192px}h1{font-size:26px}.say{font-size:15px}
  #events{margin-top:0}
  .ev{grid-template-columns:1fr 1fr}
  #links{display:grid;grid-template-columns:1fr 1fr;column-gap:28px}
  .grp{grid-template-columns:1fr}
}
@media (min-width:1100px){
  .win{max-width:1240px;grid-template-columns:320px 310px 1fr;grid-template-areas:"t t t" "o o o" "L E K" "e e e" "f f f";column-gap:40px}
  .colR{display:contents}#events{grid-area:E}#links{grid-area:K}
  .ev{grid-template-columns:1fr}
  #links h2{margin:0 0 10px}.cat+.cat+.cat h2{margin-top:26px}
  .cat{margin-bottom:0}
  .grp{gap:10px}.grp a,.grp button{padding:10px 12px}
  .opts{padding-bottom:12px;margin-bottom:22px}
  header{margin-bottom:22px}
}
@media (prefers-reduced-motion:reduce){#icon.hop,.say::after,.win.go,.grp a:hover::before,.grp button:hover::before{animation:none}}
</style>
</head>
<body>
<div id="boot"><pre></pre></div>
<main class="win">
  <div class="bar"><span>RIOTARO.EXE</span><span id="clock">PLAY 00:00</span></div>
  <div class="opts">
    <h2 class="optt">OPTION</h2>
    <div class="opt" role="group" aria-label="Language"><span>LANGUAGE</span><button type="button" data-lang="ja">日本語</button><button type="button" data-lang="en">ENGLISH</button></div>
    <div class="opt" role="group" aria-label="CRT"><span>CRT</span><button type="button" data-crt="1">ON</button><button type="button" data-crt="0">OFF</button></div>
  </div>
  <div class="colL">
  <header>
    <img id="icon" src="icon.jpg" width="128" height="128" alt="BESTIAWORKS アイコン (クリックで話しかけられます)">
    <h1 id="name">&nbsp;</h1>
    <p class="say" id="say" aria-hidden="true"></p>
    <p class="sr" id="saySr" aria-live="polite"></p>
    <button type="button" class="talk" id="talk"></button>
  </header>
  <div class="badge" id="badge" data-s="closed" hidden>
    <div class="st"><i class="dot"></i><span id="stText"></span></div>
    <div class="cd" id="cd"></div>
    <div class="gauge" id="gauge" hidden></div>
  </div>
  </div>
  <div class="colR">
  <section id="events" hidden>
    <h2 id="evH">EVENT</h2>
    <div class="ev" id="evBox"></div>
    <ul class="evx" id="evNo"></ul>
  </section>
  <div id="links"></div>
  </div>
  <p id="err"></p>
  <footer>&copy; <span id="year"></span> <span id="foot"></span>
  </footer>
</main>
<script>
(async()=>{
  const $=id=>document.getElementById(id);
  let c;
  try{c=await (await fetch("config.json",{cache:"no-cache"})).json()}
  catch(e){$("err").textContent="config.json を読めません (サーバー経由で開いてください)";return}

  const T={
    ja:{open:"受付中",limited:"少数のみ受付",closed:"停止中",mail:"メールで依頼する",cd:(n,d)=>"受付再開まで あと <b>"+n+"</b> 日 ("+d+")",alt:"アイコン (クリックで話しかけられます)",talk:["▶ 話しかける","▶ もっと話す"],ev:{confirmed:"参加確定",planned:"参加予定",absent:"不参加",space:"スペース",left:n=>n<=0?"本日開催!":"あと "+n+" 日",wd:"ja-JP",next:"直近",book:"新刊"}},
    en:{open:"OPEN",limited:"LIMITED",closed:"CLOSED",mail:"Request by email",cd:(n,d)=>"Reopens in <b>"+n+"</b> day"+(n===1?"":"s")+" ("+d+")",alt:"icon (click to talk)",talk:["▶ TALK","▶ MORE"],ev:{confirmed:"CONFIRMED",planned:"PLANNED",absent:"NOT ATTENDING",space:"Booth",left:n=>n<=0?"Today!":"in "+n+" day"+(n===1?"":"s"),wd:"en-US",next:"NEXT",book:"NEW BOOK"}}
  };
  const guess=(navigator.language||"").slice(0,2)==="ja"?"ja":"en";
  let lang=guess;
  try{lang=localStorage.lang||guess}catch(e){}
  const tx=(k,fb)=>lang==="en"&&c.en&&c.en[k]!==undefined?c.en[k]:(c[k]!==undefined?c[k]:fb);

  document.title=c.brand||c.name;
  $("foot").textContent=c.brand||c.name;$("year").textContent=new Date().getFullYear();
  if(c.icon)$("icon").src=c.icon;

  // ---- 会話ウィンドウ(タイプライター) ----
  const say=$("say");let tm;
  const type=t=>{clearInterval(tm);say.textContent="";$("saySr").textContent=t;let i=0;
    tm=setInterval(()=>{say.textContent=t.slice(0,++i);if(i>=t.length)clearInterval(tm)},45)};

  // ---- アイコン: クリックで跳ねて話す ----
  const ic=$("icon");let bag=[],talked=false;
  const lbl=()=>{$("talk").textContent=T[lang].talk[talked?1:0]};
  const talk_=()=>{talked=true;lbl();ic.classList.remove("hop");void ic.offsetWidth;ic.classList.add("hop");
    const talk=tx("talk",[]);
    if(talk.length){if(!bag.length)bag=talk.map((_,i)=>i).sort(()=>Math.random()-.5);type(talk[bag.pop()])}};
  ic.onclick=talk_;$("talk").onclick=talk_;

  // ---- コミッション状態 (日付計算は言語に依らない) ----
  const co=c.commission,JST=d=>new Date(d+"T00:00:00+09:00"),now=Date.now(),today=JST(new Date().toLocaleDateString("sv-SE",{timeZone:"Asia/Tokyo"}));
  let st=co?co.status:"";
  if(co&&st==="closed"&&co.reopen&&now>=JST(co.reopen))st="open";  // 再開日を過ぎたら自動で受付中表示
  c._open=st!=="closed";

  const box=$("links");
  function render(){
    const L=T[lang];
    document.documentElement.lang=lang;
    $("name").textContent=tx("name");$("icon").alt=(c.brand||c.name)+" "+L.alt;
    type(tx("tagline",""));bag=[];lbl();
    if(co){
      const b=$("badge");b.hidden=false;b.dataset.s=st;
      $("stText").textContent="COMMISSION: "+(L[st]||st)+(co.note?"  "+co.note:"");
      if(st==="closed"&&co.reopen){
        const t=JST(co.reopen),days=Math.ceil((t-now)/864e5);
        $("cd").innerHTML=L.cd(days,co.reopen.replace(/-/g,"/"));
        const g=$("gauge");
        if(co.since&&!g.children.length){const a=JST(co.since),r=Math.min(1,Math.max(0,(now-a)/(t-a)));g.hidden=false;
          for(let i=0;i<20;i++){const e=document.createElement("i");if(i<Math.round(r*20))e.className="on";g.append(e)}}
      }else $("cd").textContent="";
    }
    // ---- イベント参加予定 (過去分は自動で非表示) ----
    const evs=(c.events||[]).filter(e=>JST(e.date)>=today).sort((a,b)=>JST(a.date)-JST(b.date));
    const evBox=$("evBox"),evNo=$("evNo");evBox.textContent="";evNo.textContent="";
    $("events").hidden=!evs.length;
    const E=L.ev,fmt=e=>{const d=JST(e.date),w=d.toLocaleDateString(E.wd,{timeZone:"Asia/Tokyo",weekday:"short"});
      return e.date.replace(/-/g,"/")+" ("+w+")"},tg=(t,k)=>{const s=document.createElement("span");s.className="tag "+k;s.textContent=t;return s};
    let nextDone=false;
    for(const e of evs){
      const o=(lang==="en"&&e.en)||{},venue=o.venue||e.venue,nm=o.name||e.name,left=Math.round((JST(e.date)-today)/864e5);
      if(e.status==="absent"){
        const li=document.createElement("li");li.append("× ");
        if(e.url){const a=document.createElement("a");a.href=e.url;a.target="_blank";a.rel="noopener noreferrer";a.textContent=nm;li.append(a)}else li.append(nm);
        li.append("  "+fmt(e)+"  "+venue+"  ("+E.absent+")");evNo.append(li);continue}
      const isNext=!nextDone;nextDone=true;
      const card=document.createElement("div");card.className="evc"+(e.status==="planned"?" pl":"")+(isNext?" next":"");
      const n=document.createElement("span");n.className="n";
      if(isNext)n.append(tg(E.next,"nx"));n.append(tg(E[e.status]||"",e.status==="confirmed"?"ok":"pl"));if(e.tag)n.append(tg(e.tag,"ad"));
      if(e.url){const a=document.createElement("a");a.href=e.url;a.target="_blank";a.rel="noopener noreferrer";a.textContent=nm;n.append(a)}else n.append(nm);
      const d1=document.createElement("small"),d2=document.createElement("small");
      d1.innerHTML="";d1.append(fmt(e)+"  ");const cd=document.createElement("span");cd.className="cd2";cd.textContent=E.left(left);d1.append(cd);
      d2.textContent=venue+(e.space?"  /  "+E.space+" "+e.space:"");
      card.append(n,d1,d2);
      if(e.book){const bk=document.createElement("div");bk.className="bk";
        const bt=document.createElement("div");bt.className="bt";bt.append(tg(E.book,"nb"),e.book.title);
        const bs=document.createElement("small");bs.textContent=(lang==="en"&&e.book.en&&e.book.en.spec)||e.book.spec;
        bk.append(bt,bs);card.append(bk)}
      if(o.note||e.note){const d3=document.createElement("small");d3.textContent=o.note||e.note;card.append(d3)}
      evBox.append(card);
    }
    // ---- カテゴリ別リンク ----
    box.textContent="";
    const eg=(lang==="en"&&c.en&&c.en.groups)||[];
    c.groups.forEach((grp,gi)=>{
      const items=[];
      grp.links.forEach((l,li)=>{
        let el,label=l.label,desc=(eg[gi]&&eg[gi].descs[li])||l.desc||"";
        if(l.type==="mail"){
          const m=c.mail;if(!(m&&m.b64))return;  // 未設定のときだけ非表示
          el=document.createElement("button");el.type="button";label=L.mail;
          el.onclick=()=>{location.href="mailto:"+atob(m.b64)+"?subject="+encodeURIComponent(m.subject||"")};
        }else{
          el=document.createElement("a");el.href=l.url;el.target="_blank";el.rel="noopener noreferrer me";
        }
        el.innerHTML=(l.favicon?'<img class="fav" alt="" width="20" height="20" loading="lazy">':"")+"<span><b></b><small></small></span>";
        if(l.favicon)el.querySelector("img").src=l.favicon;
        el.querySelector("b").textContent=label;el.querySelector("small").textContent=desc;
        items.push(el);
      });
      if(!items.length)return;
      const h=document.createElement("h2");h.textContent=(eg[gi]&&eg[gi].title)||grp.title;
      const d=document.createElement("div");d.className="grp";d.append(...items);
      const sec=document.createElement("section");sec.className="cat";sec.append(h,d);box.append(sec);
    });
    document.querySelectorAll("[data-lang]").forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.lang===lang)));
  }
  document.querySelectorAll("[data-lang]").forEach(x=>x.onclick=()=>{
    if(lang===x.dataset.lang)return;lang=x.dataset.lang;try{localStorage.lang=lang}catch(e){}render()});
  render();

  // ---- 矢印キーでメニュー選択 ----
  addEventListener("keydown",e=>{
    if(e.key!=="ArrowDown"&&e.key!=="ArrowUp")return;
    const f=[...box.querySelectorAll("a,button")],i=f.indexOf(document.activeElement);
    f[(i+(e.key==="ArrowDown"?1:-1)+f.length)%f.length].focus();e.preventDefault();
  });
})();
</script>
<script>
(function(){
  var d=document.documentElement,b=document.getElementById("boot"),w=document.querySelector(".win");
  var ready=Promise.race([document.fonts?document.fonts.load('16px "DotGothic16"','あ'):0,new Promise(function(r){setTimeout(r,1500)})]).catch(function(){});
  function go(){ready.then(function(){d.classList.remove("boot","fl");w.classList.add("go")})}
  if(d.classList.contains("boot")){
    var L=["BESTIAWORKS SYSTEM v1.0","CHECKING MEMORY ........ OK","LOADING CONFIG ......... OK","LOADING SPRITES ........ OK","","PRESS ANY KEY"],i=0,pre=b.firstChild,t;
    var done=function(){clearInterval(t);b.remove();go();try{sessionStorage.b=1}catch(e){}};
    t=setInterval(function(){pre.textContent+=L[i++]+"\n";if(i>=L.length){clearInterval(t);setTimeout(done,350)}},170);
    b.onclick=done;addEventListener("keydown",done,{once:true});
  }else go();
  var t0=Date.now(),ck=document.getElementById("clock"),p=function(n){return(n<10?"0":"")+n},bs=document.querySelectorAll("[data-crt]");
  var sync=function(){var off=d.classList.contains("nocrt");bs.forEach(function(x){x.setAttribute("aria-pressed",String((x.dataset.crt==="0")===off))})};
  bs.forEach(function(x){x.onclick=function(){var off=x.dataset.crt==="0";d.classList.toggle("nocrt",off);sync();try{localStorage.crt=off?"0":"1"}catch(e){}}});
  sync();
  setInterval(function(){var s=Math.floor((Date.now()-t0)/1000);ck.textContent="PLAY "+p(Math.floor(s/60)%100)+":"+p(s%60)},1000);
})();
</script>
</body>
</html>
